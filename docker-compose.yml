services:
  backend:
    build: .
    ports:
      - "8888:8888"
    environment:
      - ENVIRONMENT=production
      - ZHIPUAI_API_KEY=${ZHIPUAI_API_KEY}
      - ZHIPUAI_API_KEYS=${ZHIPUAI_API_KEYS}
      - ZHIPUAI_MODEL=${ZHIPUAI_MODEL:-glm-4.5-flash}
      - ZHIPUAI_SYSTEM_PROMPT=${ZHIPUAI_SYSTEM_PROMPT}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # 可选：添加 Redis 用于缓存
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #   - "6379:6379"
  #   restart: unless-stopped