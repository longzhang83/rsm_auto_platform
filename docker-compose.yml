version: '3.8'

services:
  app:
    build: .
    ports:
      - "8888:8888"
    environment:
      - ENVIRONMENT=production
      - SERVE_FRONTEND=true
      - ZHIPUAI_API_KEY=${ZHIPUAI_API_KEY}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 可选：添加 Redis 用于缓存
  # redis:
