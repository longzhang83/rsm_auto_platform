    <!-- R -->
    <path d="M 12 20 L 12 44 L 12 20 L 20 20 C 23 20 25 22 25 25 C 25 28 23 30 20 30 L 12 30 M 20 30 L 25 44"
          stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- S -->
    <path d="M 33 23 C 31 21 29 20 27 22 C 25 24 27 26 29 27 L 31 28 C 33 29 33 31 31 33 C 29 35 27 34 26 32"
          stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- M -->
    <path d="M 37 44 L 37 20 L 43 32 L 49 20 L 49 44"
          stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
