[project]
name = "accounting-voucher-generation"
version = "0.1.0"
description = "Generate accounting vouchers from expense, employee, and subject mapping spreadsheets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1,<3.0",
    "openpyxl>=3.1,<4.0",
    "zhipuai>=2.1.5.20250825",
    "tqdm>=4.66,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "python-dateutil>=2.8,<3.0",
]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"
