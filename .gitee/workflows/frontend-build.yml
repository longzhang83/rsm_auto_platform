name: 前端构建和测试
on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 检出代码
    - name: 检出代码
      uses: actions/checkout@v2

    # 设置 Node.js 环境
    - name: 设置 Node.js 环境
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    # 进入前端目录
    - name: 进入前端目录
      run: cd frontend

    # 安装依赖
    - name: 安装依赖
      run: |
        cd frontend
        npm ci

    # 代码格式检查
    - name: 代码格式检查
      run: |
        cd frontend
        npm run lint:check || true

    # 运行测试
    - name: 运行测试
      run: |
        cd frontend
        npm run test:unit || true

    # 构建项目
    - name: 构建生产版本
      run: |
        cd frontend
        npm run build

    # 压缩构建产物
    - name: 压缩构建产物
      run: |
        cd frontend
        # 构建输出在 ../static，需要重命名为 dist
        if [ -d "../static" ]; then
          mv ../static dist
          tar -czf dist.tar.gz dist/
          mv dist ../static
        else
          echo "❌ 构建输出目录不存在"
          exit 1
        fi

    # 上传构建产物
    - name: 上传构建产物
      uses: actions/upload-artifact@v3
      with:
        name: frontend-dist
        path: frontend/dist.tar.gz
        retention-days: 7

    # 清理
    - name: 清理临时文件
      run: |
        cd frontend
        rm -f dist.tar.gz