name: 部署到生产环境
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: [build, test]

    steps:
    # 检出代码
    - name: 检出代码
      uses: actions/checkout@v2

    # 安装 uv
    - name: 安装 uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    # 设置 Python 环境
    - name: 设置 Python 环境
      run: |
        uv python install 3.10
        uv python pin 3.10

    # 下载前端构建产物
    - name: 下载前端构建产物
      uses: actions/download-artifact@v3
      with:
        name: frontend-dist
        path: frontend/

    # 解压前端构建产物
    - name: 解压前端构建产物
      run: |
        # 创建 static 目录
        mkdir -p static
        # 解压到 static 目录
        tar -xzf frontend/dist.tar.gz -C static
        rm -f frontend/dist.tar.gz

    # 设置部署环境
    - name: 设置部署环境
      run: |
        # 创建必要的目录
        mkdir -p data/output
        mkdir -p logs

        # 设置权限
        chmod 755 data/output
        chmod 755 logs

    # 安装后端依赖
    - name: 安装后端依赖
      run: |
        # 使用 uv 安装所有依赖
        uv sync --dev

    # 健康检查后端服务
    - name: 健康检查后端服务
      run: |
        cd backend
        uv run python -c "import uvicorn; print('✅ uvicorn 可用')" || true
        uv run python -c "from app.main import app; print('✅ FastAPI 应用导入成功')" || true

    # 准备数据目录
    - name: 准备数据目录
      run: |
        # 创建示例数据文件（如果不存在）
        if [ ! -f data/Expense.xlsx ]; then
          echo "创建示例费用报销表..."
          # 这里可以生成示例Excel文件
          uv run python -c "
import pandas as pd
import os

# 创建示例数据
data = {
    '日期': ['2025-01-15', '2025-01-16', '2025-01-17'],
    '费用类型': ['交通费', '餐饮费', '住宿费'],
    '金额': [150.00, 200.00, 300.00],
    '报销人': ['张三', '李四', '王五'],
    '部门': ['销售部', '市场部', '技术部'],
    '备注': ['客户拜访交通费', '客户聚餐', '出差住宿']
}

df = pd.DataFrame(data)
os.makedirs('data', exist_ok=True)
df.to_excel('data/Expense.xlsx', index=False)
print('✅ 示例费用报销表创建成功')
" || true
        fi

    # 启动后端服务
    - name: 启动后端服务
      run: |
        cd backend
        # 后台启动服务
        nohup uv run uvicorn app.main:app --host 0.0.0.0 --port 8888 > ../logs/uvicorn.log 2>&1 &

        # 等待服务启动
        echo "等待后端服务启动..."
        sleep 10

        # 检查服务是否启动成功
        curl -f http://localhost:8888/health || echo "⚠️ 后端服务启动可能失败"

    # 启动 Nginx 服务
    - name: 启动 Nginx 服务
      run: |
        # 检查 Nginx 配置
        nginx -t || echo "⚠️ Nginx 配置检查失败"

        # 启动 Nginx
        nginx || echo "⚠️ Nginx 启动可能失败"

        # 等待 Nginx 启动
        echo "等待 Nginx 启动..."
        sleep 5

        # 检查 Nginx 是否启动成功
        curl -f http://localhost:80/health || echo "⚠️ Nginx 服务启动可能失败"

    # 运行部署后测试
    - name: 运行部署后测试
      run: |
        sleep 20  # 等待服务完全启动

        # 测试 Nginx 健康检查
        echo "测试 Nginx 健康检查..."
        curl -f http://localhost:80/health || echo "❌ Nginx 健康检查失败"

        # 测试前端通过 Nginx
        echo "测试前端通过 Nginx..."
        curl -I http://localhost:80/ || echo "✅ 前端通过 Nginx 可访问"

        # 测试后端健康检查
        echo "测试后端健康检查..."
        curl -f http://localhost:8888/health || echo "❌ 后端健康检查失败"

        # 测试API通过 Nginx 代理
        echo "测试API通过 Nginx 代理..."
        curl -X GET http://localhost:80/backend-health || echo "✅ API 通过 Nginx 代理可访问"

        # 测试 API 文档通过 Nginx
        echo "测试 API 文档通过 Nginx..."
        curl -I http://localhost:80/docs || echo "✅ API 文档通过 Nginx 可访问"

    # 通知部署结果
    - name: 通知部署结果
      run: |
        echo "🚀 部署完成！"
        echo "🌐 前端应用: http://localhost:80"
        echo "📍 后端API: http://localhost:80/api/"
        echo "📊 API文档: http://localhost:80/docs"
        echo "🔧 后端直连: http://localhost:8888"

  # 清理旧文件
  cleanup:
    runs-on: ubuntu-latest
    if: ${{ failure() }}
    needs: deploy

    steps:
    - name: 清理部署文件
      run: |
        echo "清理部署文件..."
        # 清理可能的进程
        pkill -f uvicorn || true
        pkill -f nginx || true
        # 清理临时文件
        rm -rf frontend/dist.tar.gz || true

    - name: 发送失败通知
      run: |
        echo "❌ 部署失败，请检查日志文件"
        echo "📋 查看后端日志: tail -f logs/uvicorn.log"
        echo "📋 查看 Nginx 日志: tail -f /var/log/nginx/error.log"